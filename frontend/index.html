<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>운동 습관 분석 헬스 웹앱</title>
    <script>
      // 화면 스타일과 색감을 첫 그림 전에 붙인다. 키와 색감 이름은 src/app/theme.ts와 같다
      try {
        if (localStorage.getItem('balancefit.theme') === 'glass') {
          document.documentElement.dataset.theme = 'glass'
        }
        var tint = localStorage.getItem('balancefit.tint')
        if (['white', 'lavender', 'mint', 'peach', 'aurora'].indexOf(tint) >= 0) {
          document.documentElement.dataset.tint = tint
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
