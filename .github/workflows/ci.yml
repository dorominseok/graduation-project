name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            deploy:
              - 'deploy/**'
              - '.dockerignore'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # application.yaml의 ${DB_URL}/${DB_USERNAME}/${DB_PASSWORD} 기본값과 동일한 값
      DB_URL: jdbc:postgresql://localhost:5432/fitness
      DB_USERNAME: fitness
      DB_PASSWORD: devpassword123
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitness
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - run: chmod +x gradlew

      - run: ./gradlew test --no-daemon

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # main에 들어온 커밋을 운영 서버에 올린다. 서버에 실리는 파일(backend·frontend·deploy)이
  # 바뀌었을 때만 돌고, 문서만 바뀐 커밋은 건너뛴다. 테스트 하나라도 실패하면 올리지 않는다
  deploy:
    needs: [changes, backend, frontend]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name == 'push'
      && (needs.changes.outputs.backend == 'true'
        || needs.changes.outputs.frontend == 'true'
        || needs.changes.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
