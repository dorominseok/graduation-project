name: Deploy

# 운영 서버(EC2)에 main의 커밋을 올린다. main에 push되면 CI가 테스트를 통과한 뒤 부르고(ci.yml),
# Actions 탭의 Run workflow로 손으로도 돌릴 수 있다.
#
# SSH는 쓰지 않는다. 서버의 22번은 개발자 IP에만 열려 있고, Actions의 IP는 실행마다 바뀐다.
# 대신 AWS Systems Manager(SSM)로 서버에 명령을 보낸다 — 서버에 들어오는 포트를 더 열 필요가 없다.
# AWS 키도 저장하지 않는다. 실행마다 GitHub이 발급하는 OIDC 토큰으로 배포 전용 역할을 잠깐 빌린다.
# 그 역할은 이 저장소의 main에서만 빌릴 수 있고, 이 서버에 셸 명령을 보내는 것만 할 수 있다.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  SITE: https://balancefit.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 배포는 한 번에 하나씩, 들어온 순서대로. 빌드 중인 배포를 끊으면 서버가 어중간해진다
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 서버에 배포 명령 보내기
        id: send
        env:
          SHA: ${{ github.sha }}
        run: |
          # 서버에서는 root로 돈다. 코드와 docker 권한은 ubuntu 사용자 것이라 그 사용자로 실행한다.
          # 테스트를 통과한 바로 그 커밋까지만 받는다. 서버에서 손댄 커밋이 있으면 --ff-only가 멈춘다
          script="cd ~/graduation-project && git fetch -q origin main && git merge -q --ff-only $SHA && git log -1 --format='%h %s' && bash deploy/update.sh"
          params=$(jq -nc --arg c "runuser -l ubuntu -c \"$script\"" '{commands: [$c], executionTimeout: ["1500"]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: 서버 빌드 기다리기
        env:
          ID: ${{ steps.send.outputs.id }}
        run: |
          invocation() {
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query "$1" --output text
          }
          # 보낸 직후엔 조회가 InvocationDoesNotExist로 실패한다. 대기 중으로 본다
          while :; do
            status=$(invocation Status 2> /dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          invocation StandardOutputContent
          echo "::group::stderr"
          invocation StandardErrorContent
          echo "::endgroup::"
          echo "결과: $status"
          [ "$status" = Success ]

      - name: 서버 응답 확인
        run: |
          # 컨테이너를 갈아 끼운 뒤 백엔드가 뜨기까지 수십 초 걸린다. 그동안 웹서버는 502를 준다
          for _ in $(seq 36); do
            if curl -fsS "$SITE/actuator/health" | grep -q '"status":"UP"'; then
              echo "UP — $SITE"
              exit 0
            fi
            sleep 5
          done
          echo "3분 안에 UP이 되지 않았다"
          exit 1
