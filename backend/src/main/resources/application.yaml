spring:
  application:
    name: fitness-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitness}
    username: ${DB_USERNAME:fitness}
    password: ${DB_PASSWORD:devpassword123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

# 인증
app:
  jwt:
    # 서명 키는 환경변수로만 주입한다. 저장소가 Public이므로 값을 파일에 두지 않는다.
    # 로컬 기본값은 개발 전용이며 운영에서는 JWT_SECRET을 반드시 설정한다.
    secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-32b}
    access-token-ttl: 30m       # 짧게 두고 리프레시로 갱신한다
    refresh-token-ttl: 14d
    cookie-name: refreshToken
    # 쿠키 전송 경로를 /auth 아래로 좁힌다. 모든 요청에 딸려갈 이유가 없다.
    cookie-path: /api/v1/auth
    # Secure 쿠키는 http 오리진에서 브라우저가 저장하지 않는다. 로컬(http)에서만 끈다.
    # 배포에서 true가 아니면 리프레시가 저장되지 않아 30분마다 로그아웃된다.
    cookie-secure: false
    # 재사용 감지 유예 창. 동시 재발급은 밀리초 단위로 붙어 오고 탈취는
    # 그렇지 않다. 이 안의 재사용은 그 요청만 거부하고 전체 폐기는 하지 않는다.
    reuse-grace: 30s

  # 구글 로그인. 클라이언트 ID는 공개값이라 파일에 둔다(화면 빌드에도 같은 값).
  # GOOGLE_CLIENT_ID를 빈 값으로 주면 구글 로그인이 꺼진다
  google:
    client-id: ${GOOGLE_CLIENT_ID:437151768426-5b4s7s791r6upip3muj7nta8dvnkjtr3.apps.googleusercontent.com}

# 분석·통계 계산 설정
# "모든 값은 app.analysis.* 프로퍼티로 노출해 코드 수정 없이 조정 가능하게 한다."
# 판정 로직은 순수 함수로 두고 여기서 값 객체를 만들어 넘긴다(AnalysisProperties).
  analysis:
    # 판정 집계 기간(주). 기준일을 포함해 weeks x 7일
    weeks: 4
    # 부족 판정 임계 — 주당 세트. ACSM 권고를 구간화한 값 (분석 2.2)
    # 경계 포함 관계에 유의: 10과 20은 최적에 포함된다
    volume:
      insufficient-below: 4     # 미만이면 부족
      optimal-from: 10          # 이상부터 최적
      optimal-through: 20       # 이하까지 최적, 초과하면 과다
    # 균형 판정 — 큰 쪽 / 작은 쪽이 이 값을 초과하면 불균형 (분석 4.2)
    # 1:1이 아닌 이유: 일반인의 밀기:당기기가 약 1.5:1이라 1:1 기준은 정상 다수를 오판한다
    balance-ratio-threshold: 2.0
    # 최근 weeks주 운동한 날이 이 값 미만이면 신뢰도 낮음 표시 (기록 방식 5.5)
    confidence-session-threshold: 6
    # 추정 1RM 산출 대상 반복 횟수 상한. 고반복 구간은 오차가 커서 제외
    one-rm-max-reps: 12
    # 주당 평균 분모의 최솟값(일). 기록이 4주 미만이면 첫 기록일부터 센 일수로 나누되
    # 이보다 짧게는 나누지 않는다 — 첫날 5세트가 "주 35세트"가 되지 않게
    min-basis-days: 7
    # 운동 시간 산출
    bout-gap: 30m               # 이보다 긴 공백에서 구간을 나눈다 — 아침·저녁 사이 공백이 시간에 섞이지 않게
    last-set-bonus: 90s         # 구간마다 마지막 세트 수행 시간 보정
    day-cap: 4h                 # 하루 상한 — 최종 방어선
  # 오늘의 루틴. 초기값 — 실험과 실사용으로 조정한다
  routine:
    target-weekly-sets: 10        # 부위당 주 목표 = 최적 하한
    per-muscle-min-sets: 3        # 부위당 한 번에 최소·최대
    per-muscle-max-sets: 6
    fill-max-sets: 3              # 묶음을 채우는 최적 부위의 최대 세트
    daily-min-sets: 12            # 하루 총량 (약 40~60분)
    daily-max-sets: 18
    recovery-days: 2              # 오늘·어제 한 부위는 뺀다 (48시간)
    default-days-per-week: 5      # 주당 운동 일수를 모를 때 — 막 시작한 사람은 의욕이 크다
    min-known-days: 3             # 운동한 날이 이보다 적으면 모른다고 본다
    candidates-per-muscle: 5      # LLM에 넘길 후보를 작게 유지
    history-weeks: 8              # "해 본 종목"을 보는 기간
    history-max-candidates: 3     # 후보 중 해 본 종목 최대
    feedback-lookback-days: 7     # 만족도를 물을 지난 루틴 범위
  # 루틴 LLM — 종목·순서·설명만 고른다. 꺼져 있으면 규칙이 고른다
  llm:
    enabled: ${LLM_ENABLED:false}
    model: gemini-3.5-flash-lite
    timeout-ms: 10000             # 실험 r2 관측 최대 7초. 넘기면 규칙 루틴
    temperature: 0.4
    max-retries: 2                # 검증 실패 시 다시 묻기. 호출 실패는 다시 묻지 않는다
    max-output-tokens: 1024       # 실측 출력 ~130 토큰
    api-key: ${GEMINI_API_KEY:}   # 환경변수로만. 여기에 키를 적지 않는다

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug

---
# 배포용 프로필
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  # 웹서버(Caddy)가 HTTPS를 받아 http로 넘긴다. X-Forwarded-* 헤더로 원래 요청이 https였고
  # 누가 보냈는지를 알게 한다. 컨테이너 내부망 주소에서 온 헤더만 믿는다(Tomcat 기본값)
  forward-headers-strategy: native

app:
  jwt:
    # 운영은 개발용 기본 키로 뜨면 안 된다. JWT_SECRET이 없으면 기동을 실패시킨다
    secret: ${JWT_SECRET}
    # 배포는 HTTPS가 전제다. 이 값이 false면 리프레시 쿠키가 저장되지 않는다.
    cookie-secure: true

# API 문서는 개발 중 계약 확인용이다. 운영에서는 만들지도 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      # /actuator/health는 인증 없이 열려 있다. always로 두면 누구나
      # DB 벤더·연결 상태를 본다. 배포 환경에서는 상태만 노출한다.
      show-details: never

logging:
  level:
    # 운영에서 전 쿼리를 찍으면 로그가 폭증하고 파라미터가 남을 수 있다.
    org.hibernate.SQL: warn
    com.fitness.backend: info
