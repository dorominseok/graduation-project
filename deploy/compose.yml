# 운영 구성 — EC2 한 대에 DB·백엔드·웹서버 셋을 띄운다(LOG-35).
#
#   cd deploy && cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# 바깥에 열리는 건 웹서버의 80·443뿐이다. DB와 백엔드는 컨테이너끼리만 보인다.
# 개발용 DB는 저장소 루트의 docker-compose.yml이고, 이 파일과 섞이지 않는다.

name: balancefit

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 넣어야 한다}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fitness}
      DB_USERNAME: ${POSTGRES_USER:-fitness}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 넣어야 한다}
      TZ: Asia/Seoul
      # 메모리 2GB 서버에 DB·웹서버와 같이 산다. 힙은 512MB면 지인 10명에 충분하다
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseSerialGC
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?.env에 DOMAIN을 넣어야 한다}
      ACME_EMAIL: ${ACME_EMAIL:?.env에 ACME_EMAIL을 넣어야 한다}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 발급받은 인증서. 지우면 재발급을 받는데, Let's Encrypt는 같은 주소의 재발급 횟수를 제한한다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
